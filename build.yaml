# yaml-language-server: $schema=./build.yaml
targets:
  $default:
    sources:
      include:
        - $package$
        - lib/$lib$
        - pubspec.yaml
        - lib/**.dart
        - source/**
      exclude:
        - '**.g*.dart'
        - '**.mapper*.dart'

    builders:
      dart_mappable_builder:
        enabled: true
        generate_for:
          include:
            - lib/providers/**.dart

      drift_dev:
        enabled: true
        generate_for:
          include:
            - lib/providers/**.dart

      envied_generator|envied:
        enabled: true
        generate_for:
          include:
            - .env
            - lib/env.dart

      flutter_gen_runner:
        enabled: true
        generate_for:
          include:
            - source/**
        options:
          output: lib/generated/
          integrations:
            flutter_svg: true
          assets:
            enabled: true
          fonts:
            enabled: true
          colors:
            enabled: true


      go_router_builder:
        enabled: true
        generate_for:
          include:
            - lib/widgets/**.dart

      slang_build_runner:
        enabled: true
        generate_for:
          include:
            - source/i18n/**.yaml
        options:
          base_locale: en-US
          class_name: I18N
          enum_name: I18NLocale
          flat_map: false
          input_directory: source/i18n
          input_file_pattern: .yaml
          key_case: camel
          key_map_case: camel
          output_directory: lib/generated
          output_file_name: i18n.g.dart
          param_case: camel
          pluralization:
            auto: off

      riverpod_generator:
        enabled: true
        generate_for:
          include:
            - lib/providers/**.dart