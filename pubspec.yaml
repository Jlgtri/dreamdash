publish_to: none
name: dreamdash
version: 0.0.1+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0 <4.0.0"


drift_version: &drift_version ^2.21.0
riverpod_version: &riverpod_version ^3.0.0-dev.3
slang_version: &slang_version ^3.32.0
dependencies:
  cached_network_image: ^3.2.3
  # calendar_date_picker2: ^1.1.7
  catcher: ^0.8.0
  collection: ^1.19.0
  # email_validator: ^3.0.0
  # expandable_text: ^2.3.0
  drift: *drift_version
  drift_flutter: ^0.2.1
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.1-pre.4
  flutter_localizations:
    sdk: flutter
  flutter_multi_formatter: ^2.10.2
  flutter_native_splash: ^2.2.17
  flutter_riverpod: *riverpod_version
  flutter_svg: ^2.0.4

  go_router: ^14.3.0

  hooks_riverpod: *riverpod_version
  # image_picker: ^1.1.2
  intl: ^0.19.0
  logging: ^1.1.0
  meta: ^1.16.0
  path_provider: ^2.0.12
  riverpod: *riverpod_version
  riverpod_annotation: *riverpod_version

  slang: *slang_version
  slang_flutter: *slang_version

  supabase: ^2.5.0
  supabase_auth_ui: ^0.5.4
  supabase_flutter: ^2.8.0
  # tcard: ^1.3.5
  tuple: ^2.0.1
  # video_player: ^2.6.1
  # youtube_player_flutter: ^9.1.1

dev_dependencies:
  build_runner: ^2.4.13
  dart_mappable: ^4.2.2
  drift_dev: *drift_version
  flutter_launcher_icons: ^0.14.1
  go_router_builder: ^2.7.1
  riverpod_generator: ^3.0.0-dev.11
  slang_build_runner: *slang_version

dependency_overrides:
  analyzer: 6.7.0
  collection: ^1.19.0
  # device_info_plus: ^11.1.0
  # email_validator: ^3.0.0
  # ffi: ^2.1.3
  flutter_hooks: ^0.21.1-pre.4
  # image: ^4.3.0
  # intl: ^0.19.0
  # js: ^0.7.1
  meta: ^1.16.0
  # package_info_plus: ^8.1.0
  # package_info_plus_platform_interface: ^3.0.1
  # rxdart: ^0.28.0
  # sentry: ^8.9.0
  # very_good_analysis: ^6.0.0


flutter:
  assets:
    - source/assets/

  fonts:
    - family: Icons
      fonts:
        - asset: source/icons.ttf

    # Only for Android
    - family: .SF Pro Text
      fonts:
        - asset: source/fonts/SF Pro Text/SF-Pro-Text-Regular.otf
          weight: 400
        - asset: source/fonts/SF Pro Text/SF-Pro-Text-Medium.otf
          weight: 500
        - asset: source/fonts/SF Pro Text/SF-Pro-Text-SemiBold.otf
          weight: 600
        - asset: source/fonts/SF Pro Text/SF-Pro-Text-Bold.otf
          weight: 700

flutter_icons:
  android: launcher_icons
  ios: true
  remove_alpha_ios: true
  image_path: source/icon.png

flutter_native_splash:
  color: "#ffffff"
  image: source/icon.png
