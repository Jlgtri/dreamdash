flutter:
  uses-material-design: true
  assets:
    - source/assets/authorization/01_prompt/
    - source/assets/authorization/02_verification/
    - source/assets/onboarding/00_splash/
    - source/assets/onboarding/01_welcome/
    - source/assets/onboarding/02_introduction/
    - source/assets/onboarding/03_greeting/
    - source/assets/onboarding/04_gender/
    - source/assets/onboarding/05_age/
    - source/assets/onboarding/06_info/
    - source/assets/onboarding/07_motivation_q1/
    - source/assets/onboarding/08_motivation_q2/
    - source/assets/onboarding/09_motivation_q3/
    - source/assets/onboarding/10_motivation_level/
    - source/assets/onboarding/11_progress/
    - source/assets/onboarding/12_mental_health_q1/
    - source/assets/onboarding/13_mental_health_q2/
    - source/assets/onboarding/14_mental_health_q3/
    - source/assets/onboarding/15_mental_health_q4/
    - source/assets/onboarding/16_mental_health_q5/
    - source/assets/onboarding/17_info_2/
    - source/assets/onboarding/18_comparison/
    - source/assets/onboarding/19_journey/
    - source/assets/onboarding/20_statement_q1/
    - source/assets/onboarding/21_statement_q2/
    - source/assets/onboarding/22_motivation_progress/
    - source/assets/onboarding/23_testimonials/
    - source/assets/onboarding/24_task/
    - source/assets/onboarding/25_wishlist/
    - source/assets/onboarding/26_commitment/
    - source/assets/onboarding/27_notification/
    - source/assets/onboarding/28_promise/
    - source/assets/onboarding/29_chat/
    - source/assets/onboarding/30_paywall/

  fonts:
    - family: Verdana
      fonts:
        - asset: source/fonts/Verdana/Verdana-Bold.ttf
          weight: 700

    - family: Gotham Pro
      fonts:
        - asset: source/fonts/Gotham Pro/Gotham-Pro-Bold.ttf
          weight: 700
        - asset: source/fonts/Gotham Pro/Gotham-Pro-Black.ttf
          weight: 900

    # Only for Android
    - family: .SF Pro Text
      fonts:
        - asset: source/fonts/SF Pro Text/SF-Pro-Text-Regular.otf
          weight: 400
        - asset: source/fonts/SF Pro Text/SF-Pro-Text-Medium.otf
          weight: 500
        - asset: source/fonts/SF Pro Text/SF-Pro-Text-SemiBold.otf
          weight: 600
        - asset: source/fonts/SF Pro Text/SF-Pro-Text-Bold.otf
          weight: 700
        - asset: source/fonts/SF Pro Text/SF-Pro-Text-Heavy.otf
          weight: 900

flutter_icons:
  android: launcher_icons
  ios: true
  remove_alpha_ios: true
  image_path: source/icon.png

flutter_native_splash:
  color: "#ffffff"
  background_image: source/assets/splash.png
  image: source/assets/logo.png
  fullscreen: true
